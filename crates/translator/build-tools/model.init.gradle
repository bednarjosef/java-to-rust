// Gradle init script of java-to-rust (--project): adds the task javaToRustModel to every project,
// which writes what the translator needs to know about the build to the file named by the
// project property javaToRustOut, one tab-separated line per fact:
//   source <dir>             a directory of the main source set's Java sources
//   resources <dir>          a directory of the main source set's resources
//   jar <coordinates> <file> a jar of an external dependency on the runtime class path
//   sources <coordinates> <file>  that dependency's sources jar, where its repository has one
//   main <class>             the application plugin's main class
// Dependencies on other projects of the build are left out: their sources are those projects'.
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.jvm.JvmLibrary
import org.gradle.language.base.artifact.SourcesArtifact

allprojects {
    tasks.register('javaToRustModel') {
        doLast {
            def out = new File(project.property('javaToRustOut') as String)
            def lines = []
            def sourceSets = project.extensions.findByName('sourceSets')
            def main = sourceSets?.findByName('main')
            if (main != null) {
                main.java.srcDirs.each { if (it.isDirectory()) lines << "source\t${it.absolutePath}" }
                main.resources.srcDirs.each { if (it.isDirectory()) lines << "resources\t${it.absolutePath}" }
                def classpath = project.configurations.findByName('runtimeClasspath')
                if (classpath != null) {
                    def ids = []
                    classpath.incoming.artifacts.artifacts.each { artifact ->
                        def id = artifact.id.componentIdentifier
                        if (id instanceof ModuleComponentIdentifier) {
                            ids << id
                            lines << "jar\t${id.group}:${id.module}:${id.version}\t${artifact.file.absolutePath}"
                        }
                    }
                    def result = project.dependencies.createArtifactResolutionQuery()
                        .forComponents(ids)
                        .withArtifacts(JvmLibrary, SourcesArtifact)
                        .execute()
                    result.resolvedComponents.each { component ->
                        def id = component.id
                        component.getArtifacts(SourcesArtifact).each { sources ->
                            if (sources.hasProperty('file')) {
                                lines << "sources\t${id.group}:${id.module}:${id.version}\t${sources.file.absolutePath}"
                            }
                        }
                    }
                }
            }
            def application = project.extensions.findByName('application')
            def mainClass = application?.mainClass?.getOrNull()
            if (mainClass) lines << "main\t${mainClass}"
            synchronized (javaToRustLock) {
                out << lines.collect { it + '\n' }.join('')
            }
        }
    }
}

class javaToRustLock {}
