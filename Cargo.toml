[workspace]
resolver = "3"
members = ["crates/translator", "crates/runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/bednarjosef/java-to-rust"

# Dependencies (serde_json and the rest) are compiled once, so optimizing them costs a clean
# build some seconds and an incremental build of the translator nothing.
[profile.dev.package."*"]
opt-level = 3

# The build that scripts/check.sh runs the integration tests in and targets/run.sh runs:
# whole-program translations with the JDK's sources take up to a minute each in a debug build and
# seconds optimized. It keeps the debug build's checks (debug assertions, overflow checks), so it
# translates as `cargo test`'s translator does, and of the debug information only the line tables,
# which panics' backtraces need.
[profile.checks]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
