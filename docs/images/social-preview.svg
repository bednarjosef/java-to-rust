<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub's social preview for the repository (rendered to social-preview.png, 1280x640,
       with rsvg-convert). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c0b4"/>
      <stop offset="0.42" stop-color="#ddb89a"/>
      <stop offset="0.6" stop-color="#eba57a"/>
    </linearGradient>
    <radialGradient id="glow" cx="640" cy="330" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6c79f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f6c79f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="640">
      <stop offset="0" stop-color="#3f6f93"/>
      <stop offset="0.35" stop-color="#2c5677"/>
      <stop offset="1" stop-color="#173149"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d2b3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3d2b3" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="world">
      <ellipse cx="640" cy="1960" rx="1700" ry="1630"/>
    </clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.11 0"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="640" fill="url(#sky)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- The curved horizon, with faint contour lines across it -->
  <ellipse cx="640" cy="1960" rx="1700" ry="1630" fill="url(#sea)"/>
  <g clip-path="url(#world)" fill="none" stroke="#d9e6ef" stroke-opacity="0.09" stroke-width="1.2">
    <ellipse cx="640" cy="1985" rx="1700" ry="1630"/>
    <ellipse cx="640" cy="2015" rx="1700" ry="1630"/>
    <ellipse cx="640" cy="2052" rx="1700" ry="1630"/>
    <ellipse cx="640" cy="2097" rx="1700" ry="1630"/>
    <ellipse cx="640" cy="2150" rx="1700" ry="1630"/>
    <ellipse cx="640" cy="2212" rx="1700" ry="1630"/>
    <ellipse cx="640" cy="2284" rx="1700" ry="1630"/>
  </g>
  <rect x="0" y="330" width="1280" height="26" fill="url(#rim)" clip-path="url(#world)"/>

  <!-- Name and line -->
  <g font-family="Crimson Pro" text-anchor="middle">
    <text x="640" y="196" font-size="96" font-weight="500" letter-spacing="0.5" fill="#1b2f46">java-to-rust</text>
    <text x="640" y="256" font-size="32" font-weight="400" fill="#2d4762">Translates whole Java programs into Rust, with the exact same output.</text>
    <text x="640" y="298" font-size="23" font-weight="400" font-style="italic" fill="#3a4f66">Not an LLM, an agent or a skill: one program that does it all on its own.</text>
  </g>

  <!-- Results -->
  <g font-family="Crimson Pro" text-anchor="middle" fill="#f4ece2">
    <text x="250" y="468" font-size="34" font-weight="500">Java compiler</text>
    <text x="250" y="506" font-size="23" font-weight="400" fill-opacity="0.88">translated to Rust in 65 seconds</text>
    <text x="250" y="536" font-size="23" font-weight="400" fill-opacity="0.88">951,000 lines of Rust</text>

    <text x="640" y="468" font-size="34" font-weight="500">Minecraft 26.3</text>
    <text x="640" y="506" font-size="23" font-weight="400" fill-opacity="0.88">translated to Rust in 6 minutes</text>
    <text x="640" y="536" font-size="23" font-weight="400" fill-opacity="0.88">7.3 million lines of Rust</text>

    <text x="1030" y="468" font-size="34" font-weight="500">1,000+ programs</text>
    <text x="1030" y="506" font-size="23" font-weight="400" fill-opacity="0.88">the exact same output, every one</text>
    <text x="1030" y="536" font-size="23" font-weight="400" fill-opacity="0.88">99.9% of Minecraft's code translates</text>

    <g stroke="#f4ece2" stroke-opacity="0.22" stroke-width="1">
      <path d="M445 452 V546"/>
      <path d="M835 452 V546"/>
    </g>
  </g>

  <!-- Film grain -->
  <rect width="1280" height="640" filter="url(#grain)"/>
</svg>
